<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Kalkulator Kalorii</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 300px;
    }
    input, select, button {
      width: 100%;
      margin: 10px 0;
      padding: 8px;
    }
    button {
      background: #28a745;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background: #218838;
    }
    .result {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Kalkulator Kalorii</h2>

    <input type="number" id="weight" placeholder="Waga (kg)">
    <input type="number" id="height" placeholder="Wzrost (cm)">
    <input type="number" id="age" placeholder="Wiek">

    <select id="gender">
      <option value="male">Mężczyzna</option>
      <option value="female">Kobieta</option>
    </select>

    <select id="activity">
      <option value="1.2">Brak aktywności</option>
      <option value="1.375">Lekka aktywność</option>
      <option value="1.55">Średnia aktywność</option>
      <option value="1.725">Duża aktywność</option>
    </select>

    <button onclick="calculateCalories()">Oblicz</button>

    <div class="result" id="result"></div>
  </div>

  <script>
    function calculateCalories() {
      const weight = document.getElementById('weight').value;
      const height = document.getElementById('height').value;
      const age = document.getElementById('age').value;
      const gender = document.getElementById('gender').value;
      const activity = document.getElementById('activity').value;

      if (!weight || !height || !age) {
        document.getElementById('result').innerText = 'Uzupełnij wszystkie dane!';
        return;
      }

      let bmr;

      if (gender === 'male') {
        bmr = 10 * weight + 6.25 * height - 5 * age + 5;
      } else {
        bmr = 10 * weight + 6.25 * height - 5 * age - 161;
      }

      const calories = Math.round(bmr * activity);

      document.getElementById('result').innerText = `Twoje zapotrzebowanie: ${calories} kcal/dzień`;
    }
  </script>
</body>
</html>
